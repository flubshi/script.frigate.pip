name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"        # Kodi 19 (Matrix)
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-timeout Pillow
      - run: python -m pytest

  addon-checker:
    name: Kodi add-on checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install kodi-addon-checker
      - run: kodi-addon-checker --branch piers script.frigate.pip

  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: [lint, test, addon-checker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: script.frigate.pip
          path: dist/*.zip
          if-no-files-found: error
