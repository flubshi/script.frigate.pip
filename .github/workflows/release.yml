name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ZIP (the tag must match addon.xml)
        run: python tools/build_zip.py --tag "${GITHUB_REF_NAME}"
      - name: Release notes from CHANGELOG.md
        run: python tools/build_zip.py --notes > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*.zip
          fail_on_unmatched_files: true
